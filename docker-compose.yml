services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xdebug-php
    extra_hosts:
      - "host.docker.internal:${WSL_HOST_IP}"
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:80"
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: mysql:8.4.3
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: xdebug_php
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
