services:
  xdebug_traefik:
    image: docker.arvancloud.ir/traefik:v3.6
    container_name: xdebug_traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./docker/traefik/traefik.yml:/traefik.yml:ro"
      - "./docker/traefik/dynamic_conf.yml:/dynamic_conf.yml:ro"
      - "./docker/traefik/certs:/certs:ro"
    networks:
      - app-network

  xdebug_php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xdebug_php
    volumes:
      - ./:/var/www/html
    networks:
      - app-network
    depends_on:
      - xdebug_mysql

  xdebug_mysql:
    image: docker.arvancloud.ir/mysql:8.4.3
    container_name: xdebug_mysql
    environment:
      MYSQL_DATABASE: xdebug_php
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
